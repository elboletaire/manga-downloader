name: Website

on:
  # after each release's build succeeds, so the assets exist (the environment only deploys from master);
  # Release GUI alone, as it always finishes after Release and one deploy per release is enough
  workflow_run:
    workflows: [Release GUI]
    types: [completed]
  # manual deploy, dispatched from master for urgent fixes
  workflow_dispatch:
  schedule:
    # Refresh the download stats daily, from the latest release
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; let a running one finish instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # only successful runs of release-triggered builds deploy
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    steps:
      # scheduled and release runs build the latest release, not master; an empty
      # ref would make checkout fall back to master, so a failed lookup stops the run
      - id: latest
        if: github.event_name != 'workflow_dispatch'
        working-directory: .
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.latest.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: make test/website

      - run: make build/website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
