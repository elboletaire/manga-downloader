name: Website

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      # the supported sites list is generated from it
      - "README.md"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:
  schedule:
    # Refresh the download stats daily
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; let a running one finish instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
