name: Site smoke tests

# Weekly run of the live-site smoke targets to detect layout/API changes on
# supported sites. Each matrix entry downloads a real chapter and verifies the
# resulting CBZ actually contains images.
#
# Only plain-HTTP grabbers are listed: browser-based sites (make grabber/browser
# plus the headless-Chrome comix/leercapitulo/mkissa) need a real Chrome and
# often an interactive Cloudflare challenge, which cannot work on a headless
# datacenter runner, so they are intentionally excluded.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  grabber:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          # API / JSON / SSR / Madara grabbers (plain HTTP, no browser)
          - inmanga
          - mangadex
          - mangabats
          - mangak
          - mgeko
          - mangapark
          - mangaball
          - mangadenizi
          - qimanga
          - aurorascans
          - fanfox
          - mangahere
          - flamecomics
          - weebcentral
          - guya
          - danke
          - atsumaru
          - bluesolo
          - fmteam
          - jestful
          - projectsuki
          - roliascan
          - teamshadowi
          - taiyo
          - stonescape
          - utoon
          - vortexscans
          - genztoon
          - kaynscan
          - hijala
          - mangataro
          - tcb
          - mangasushi
          - gdscans
          - mangalivre
          - tritinia
          # Plain-HTML (goquery) scrapers
          - tcbscans
          - asura
          - zonatmo
          - mangapill
          - demonicscans
          - mangakatana
          - rawkuma
          - dynastyscans
          - mangaread
          - manhuaplus
          - templetoons
          - deathtollscans
          - furyosociety
          - elftoon
          - asmotoon
          - madarascans
          - lagoonscans
          - rokaricomics
          - ritharscans
          - sanascans
          - thunderscans
          - violetscans
          - witchtoons
          - writerscans
          - mistscans
          # These sites block GitHub's datacenter IPs (403) but work fine
          # from residential connections — verified locally 2026-07-23.
          # Kept out of the matrix rather than hammering sites that don't
          # want automated traffic; smoke-test them locally instead.
          # - mangalib     # 403 on series page
          # - silentquill  # 403 on series page
          # - bigsolo      # 403 on series page
          # - luascans     # 403 on series page
          # - hivetoons    # chapter list loads, image CDN 403s every page
          # - mangitto     # whole domain Cloudflare-hard-blocked (403 "you
          #                # have been blocked"), including residential IPs and
          #                # real browsers — verified 2026-08-04. Grabber kept
          #                # in case the block lifts; smoke-test locally.
          # - mangafire    # now browser-based: the SPA signs every JSON API
          #                # call with a per-session cloudflare-gated `vrf`
          #                # token (plain HTTP → 403 "Missing token"), so the
          #                # grabber renders the pages and intercepts the
          #                # signed responses — excluded from the matrix like
          #                # every other browser grabber. Run `make
          #                # grabber/mangafire` locally.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download chapters
        run: make grabber/${{ matrix.target }}

      # The downloader exits 0 even when chapters or pages fail to download,
      # so check the archives actually contain images.
      - name: Verify CBZ contents
        run: |
          ls -la *.cbz
          go run ./tools/verify-cbz *.cbz
