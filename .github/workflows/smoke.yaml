name: Site smoke tests

# Twice-weekly run of the live-site smoke targets to detect layout/API changes on
# supported sites. The makefile picks the targets (make smoke/list): the ones
# whose README rows were verified longest ago, split over eight shards that each
# check their share one at a time, so a run stays gentle on the sites and on
# runners. A site comes round about every two weeks. The makefile's smoke
# section says which targets CI skips and why.
#
# A final job writes the results into the README's "Last verified" column.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated targets to check instead of the rotation"
        required: false
        default: ""
      all:
        description: "Check every target, not the rotation"
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TARGETS: ${{ inputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check this shard's targets
        run: make smoke SHARD=${{ matrix.shard }} SHARDS=8 SMOKE_RESULTS=shard-${{ matrix.shard }}.txt TARGETS="$TARGETS" ${{ inputs.all && 'SMOKE_COUNT=all' || '' }}

      # One "target pass|fail" line per target, for the status job below.
      - name: Upload result
        if: always() && job.status != 'cancelled'
        uses: actions/upload-artifact@v4
        with:
          name: result-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.txt

  # Writes the results into the README's "Last verified" column. Only the
  # default branch's runs do, so a manual run from a branch leaves it alone.
  status:
    needs: smoke
    if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      # master requires signed commits and linear history, which a pushed
      # bot commit can't meet; createCommitOnBranch makes GitHub sign it.
      - name: Update the README and commit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          update() {
            cat results/*.txt > results.all
            go run ./tools/site-status -results results.all -date "$(date -u +%F)"
          }
          commit() {
            base64 -w0 README.md > readme.b64
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" \
              --arg oid "$(git rev-parse HEAD)" --rawfile contents readme.b64 '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                variables: { input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: "docs(readme): update sites'"'"' last verified dates [skip ci]" },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: [{ path: "README.md", contents: $contents }] }
                } }
              }' > body.json
            gh api graphql --input body.json
          }
          update
          git diff --quiet README.md && exit 0
          # A stale head means the branch moved: redo the update on the new head, once.
          commit || {
            git checkout -- README.md
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            update
            git diff --quiet README.md && exit 0
            commit
          }
