name: Site smoke tests

# Weekly run of the live-site smoke targets to detect layout/API changes on
# supported sites. Each matrix entry downloads a real chapter and verifies the
# resulting CBZ actually contains images.
#
# Only plain-HTTP grabbers are listed: browser-based sites (make grabber/browser
# plus the headless-Chrome comix/mkissa/templetoons) need a real Chrome and
# often an interactive Cloudflare challenge, which cannot work on a headless
# datacenter runner, so they are intentionally excluded.
#
# A final job writes the results into the README's "Last verified" column.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  grabber:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          # API / JSON / SSR / Madara grabbers (plain HTTP, no browser)
          - inmanga
          - mangadex
          - mangabats
          - manganato
          - mangak
          - mgeko
          - mangaball
          - mangadenizi
          - qimanga
          - aurorascans
          - fanfox
          - mangahere
          - mangatown
          - flamecomics
          - weebcentral
          - leercapitulo
          - guya
          - hachirumi
          - danke
          - atsumaru
          - globalcomix
          - bluesolo
          - chainsawman
          - fmteam
          - apothecary
          - jestful
          - jojolands
          - projectsuki
          - roliascan
          - teamshadowi
          - taiyo
          - stonescape
          - utoon
          - vortexscans
          - azorafly
          - genztoon
          - heavenlydelusion
          - heavenmanga
          - kaynscan
          - elftoon
          - hijala
          - mangataro
          - tcb
          - webtoonia
          - mangasushi
          - gdscans
          - nijitranslations
          - gourmetsupremacy
          - anikiga
          - tortugaceviri
          - mangalivre
          - tritinia
          - 3asq
          - webtoons
          - animeallstar1
          - animeallstar30
          - blackcloveronline
          - chainsawmannmanga
          - dragonballmangaa
          - jujutsukaisenmanga
          - mangadelsiglotvmanga
          - re-yume
          - tvymanga3
          - shonenjumpplus
          - tonarinoyj
          - comicdays
          - kuragebunch
          - magcomi
          - comicgardo
          - comiczenon
          - comicaction
          - comictrail
          - comicearthstar
          - comicogyaaa
          - sundaywebry
          - comicseasons
          - comicyours
          - ourfeel
          - feelweb
          - ichicomi
          - mangatimesquare
          # Plain-HTML (goquery) scrapers
          - tcbscans
          - arenascan
          - asura
          - zonatmo
          - mangapill
          - demonicscans
          - mangakatana
          - ravenscans
          - rawkuma
          - dynastyscans
          - mangaread
          - mangasorigines
          - manhuaplus
          - manhwaonline
          - decadencescans
          - mangalami
          - deathtollscans
          - evascans
          - furyosociety
          - komikindo
          - komikmanga
          - madaradex
          - madarascans
          - maid
          - anzmanga25
          - onma
          - oremanga
          - mangaberri
          - kingofshojo
          - komikstation
          - mangavault
          - mangaworld
          - lagoonscans
          - lelmanga
          - lelscanfr
          - lelscans
          - mangasusuku
          - rizzfables
          - rokaricomics
          - ritharscans
          - sanascans
          - scanvf
          - thunderscans
          - trmanga
          - uzaymanga
          - violetscans
          - witchtoons
          - writerscans
          - mistscans
          - mangapark
          - eldermanga
          - eskimangalar
          - limonmanga
          - ksgroupscans
          - manhwatop
          - mangazin
          - turkcemanga
          - yurionair
          - adonisfansub
          - nyraxmanga
          - rackusreads
          - mangaeclipse
          - mangawow
          - ruyamanga2
          - natsuone
          - noranofansub
          - apollcomics
          - fbsquadx
          - kombatch
          - mundomanhwa
          - smuglo
          # These sites block GitHub's datacenter IPs (403) but work fine
          # from residential connections — verified locally 2026-07-23.
          # Kept out of the matrix rather than hammering sites that don't
          # want automated traffic; smoke-test them locally instead.
          # - mangalib     # 403 on series page
          # - silentquill  # 403 on series page
          # - bigsolo      # 403 on series page
          # - luascans     # 403 on series page
          # - hivetoons    # chapter list loads, image CDN 403s every page
          # - mangitto     # whole domain Cloudflare-hard-blocked (403 "you
          #                # have been blocked"), including residential IPs and
          #                # real browsers — verified 2026-08-04. Grabber kept
          #                # in case the block lifts; smoke-test locally.
          # - mangafire    # now browser-based: the SPA signs every JSON API
          #                # call with a per-session cloudflare-gated `vrf`
          #                # token (plain HTTP → 403 "Missing token"), so the
          #                # grabber renders the pages and intercepts the
          #                # signed responses — excluded from the matrix like
          #                # every other browser grabber. Run `make
          #                # grabber/mangafire` locally.
          # - templetoons  # now browser-based: plain HTTP is redirected to the
          #                # site's own Turnstile /challenge page, which only a
          #                # browser clears. Run `make grabber/templetoons` locally.
          # - asmotoon     # now browser-based: cloudflare challenges plain HTTP
          #                # and headless alike. Run `make grabber/asmotoon`
          #                # locally.
          # - lilymanga    # rate-limits hard (429 on the series path, even
          #                # from residential IPs); smoke-test locally.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download chapters
        run: make grabber/${{ matrix.target }}

      # The downloader exits 0 even when chapters or pages fail to download,
      # so check the archives actually contain images.
      - name: Verify CBZ contents
        run: |
          ls -la *.cbz
          go run ./tools/verify-cbz *.cbz

      # One line per target for the status job below; skipped when cancelled.
      - name: Record result
        if: always() && job.status != 'cancelled'
        run: |
          mkdir -p result
          if [ "${{ job.status }}" = success ]; then r=pass; else r=fail; fi
          echo "${{ matrix.target }} $r" > result/${{ matrix.target }}.txt

      - name: Upload result
        if: always() && job.status != 'cancelled'
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.target }}
          path: result/${{ matrix.target }}.txt

  # Writes the results into the README's "Last verified" column. Only the
  # default branch's runs do, so a manual run from a branch leaves it alone.
  status:
    needs: grabber
    if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      # master requires signed commits and linear history, which a pushed
      # bot commit can't meet; createCommitOnBranch makes GitHub sign it.
      - name: Update the README and commit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          update() {
            cat results/*.txt > results.all
            go run ./tools/site-status -results results.all -date "$(date -u +%F)"
          }
          commit() {
            base64 -w0 README.md > readme.b64
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" \
              --arg oid "$(git rev-parse HEAD)" --rawfile contents readme.b64 '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                variables: { input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: "docs(readme): update sites'"'"' last verified dates [skip ci]" },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: [{ path: "README.md", contents: $contents }] }
                } }
              }' > body.json
            gh api graphql --input body.json
          }
          update
          git diff --quiet README.md && exit 0
          # A stale head means the branch moved: redo the update on the new head, once.
          commit || {
            git checkout -- README.md
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            update
            git diff --quiet README.md && exit 0
            commit
          }
