name: Site smoke tests

# Twice-weekly live-site smoke run: `make smoke` checks this run's targets, split
# over eight shards (the makefile's smoke section says which and how).
# A final job writes the results into the README's "Last verified" column.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated targets to check instead of the rotation"
        required: false
        default: ""
      all:
        description: "Check every target, not the rotation"
        type: boolean
        default: false

# one run at a time: each picks its batch from the dates the previous one wrote
concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # about 14 targets per shard at up to 5 minutes each; `all` runs far more
    timeout-minutes: ${{ inputs.all && 360 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TARGETS: ${{ inputs.targets }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # target names are lowercase letters, digits and hyphens, so nothing else reaches make
      - name: Check this shard's targets
        run: |
          case "$TARGETS" in
            *[!a-z0-9\ -]*) echo "::error::targets takes lowercase names separated by spaces" >&2; exit 1 ;;
          esac
          make smoke SHARD=${{ matrix.shard }} SHARDS=8 SMOKE_RESULTS=shard-${{ matrix.shard }}.txt TARGETS="$TARGETS" ${{ inputs.all && 'SMOKE_COUNT=all' || '' }}

      # One "target pass|fail" line per target, for the status job below. Uploaded
      # even when cancelled, so a long shard keeps the targets it finished.
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.txt

  # Writes the results into the README's "Last verified" column. Only the
  # default branch's runs do, so a manual run from a branch leaves it alone.
  status:
    needs: smoke
    if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Summarise the results
        run: |
          cat results/*.txt > results.all
          make smoke/summary RESULTS=results.all

      # master requires signed commits and linear history, which a pushed
      # bot commit can't meet; createCommitOnBranch makes GitHub sign it.
      - name: Update the README and commit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          update() {
            go run ./tools/site-status -results results.all -date "$(date -u +%F)"
          }
          commit() {
            base64 -w0 README.md > readme.b64
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" \
              --arg oid "$(git rev-parse HEAD)" --rawfile contents readme.b64 '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                variables: { input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: "docs(readme): update sites'"'"' last verified dates [skip ci]" },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: [{ path: "README.md", contents: $contents }] }
                } }
              }' > body.json
            gh api graphql --input body.json
          }
          update
          git diff --quiet README.md && exit 0
          # A stale head means the branch moved: redo the update on the new head, once.
          commit || {
            git checkout -- README.md
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            update
            git diff --quiet README.md && exit 0
            commit
          }
