name: Site smoke tests

# Weekly live-site smoke run: `make smoke` checks this run's targets over eight
# shards; the sites that 403 outside Japan (SMOKE_JAPAN) run on a self-hosted
# runner there (smoke-japan). A final job writes the results into the README.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated targets to check instead of the rotation"
        required: false
        default: ""
      all:
        description: "Check every target, not the rotation"
        type: boolean
        default: false

# one run at a time: each picks its batch from the dates the previous one wrote
concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # about 28 targets per shard at up to 5 minutes each; `all` runs far more
    timeout-minutes: ${{ inputs.all && 360 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TARGETS: ${{ inputs.targets }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      # target names are lowercase letters, digits and hyphens, so nothing else reaches make
      - name: Check this shard's targets
        run: |
          case "$TARGETS" in
            *[!a-z0-9\ -]*) echo "::error::targets takes lowercase names separated by spaces" >&2; exit 1 ;;
          esac
          # the Japan targets belong to smoke-japan; a manual list of only those leaves nothing here
          if [ -n "$TARGETS" ]; then
            TARGETS="$(make -s smoke/hosted TARGETS="$TARGETS" | paste -sd' ' -)"
            [ -n "$TARGETS" ] || { echo "::notice::only Japan targets were asked for: smoke-japan checks them"; exit 0; }
          fi
          make smoke SHARD=${{ matrix.shard }} SHARDS=8 SMOKE_RESULTS=shard-${{ matrix.shard }}.txt TARGETS="$TARGETS" ${{ inputs.all && 'SMOKE_COUNT=all' || '' }}

      # One "target pass|fail" line per target, for the status job below. Uploaded
      # even when cancelled, so a long shard keeps the targets it finished.
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.txt
          if-no-files-found: ignore

  # The SMOKE_JAPAN targets (403 from GitHub's runners), always their whole list.
  # The runner reaches GitHub directly; the check step goes through its Tokyo
  # proxy (gluetun) and fails up front when that doesn't exit in Japan. If the
  # runner is offline the job sits queued (GitHub fails it after 24h).
  smoke-japan:
    runs-on: [self-hosted, japan]
    # 29 targets at up to 5 minutes each
    timeout-minutes: 180
    env:
      TARGETS: ${{ inputs.targets }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: Check the Japan targets
        env:
          HTTPS_PROXY: http://gluetun:8888
          HTTP_PROXY: http://gluetun:8888
        run: |
          case "$TARGETS" in
            *[!a-z0-9\ -]*) echo "::error::targets takes lowercase names separated by spaces" >&2; exit 1 ;;
          esac
          list="$(make -s smoke/japan TARGETS="$TARGETS" | paste -sd' ' -)"
          [ -n "$list" ] || { echo "::notice::no Japan targets in the input"; exit 0; }
          # both answer 403 outside Japan, so a 200 from either proves the exit is Japanese
          ok=0
          for u in https://comic-growl.com/ https://comics.comici.jp/; do
            code="$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$u" || true)"
            [ "$code" = 200 ] && ok=1
          done
          [ "$ok" = 1 ] || { echo "::error::the Japan proxy isn't reachable or doesn't exit in Japan" >&2; exit 1; }
          make smoke TARGETS="$list" SMOKE_RESULTS=japan.txt

      # Uploaded even when cancelled or failed; a run that checked nothing has no file.
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-japan
          path: japan.txt
          if-no-files-found: ignore

  # Writes the results into the README's "Last verified" column. Only the
  # default branch's runs do, so a manual run from a branch leaves it alone.
  status:
    needs: [smoke, smoke-japan]
    if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Summarise the results
        run: |
          cat results/*.txt > results.all
          make smoke/summary RESULTS=results.all

      # master requires signed commits and linear history, which a pushed
      # bot commit can't meet; createCommitOnBranch makes GitHub sign it.
      - name: Update the README and commit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          update() {
            go run ./tools/site-status -results results.all -date "$(date -u +%F)"
          }
          commit() {
            base64 -w0 README.md > readme.b64
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" \
              --arg oid "$(git rev-parse HEAD)" --rawfile contents readme.b64 '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                variables: { input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: "docs(readme): update sites'"'"' last verified dates [skip ci]" },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: [{ path: "README.md", contents: $contents }] }
                } }
              }' > body.json
            gh api graphql --input body.json
          }
          update
          git diff --quiet README.md && exit 0
          # A stale head means the branch moved: redo the update on the new head, once.
          commit || {
            git checkout -- README.md
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            update
            git diff --quiet README.md && exit 0
            commit
          }
