name: Stats

# Keeps a daily snapshot of release downloads, Docker Hub pulls and stars on
# the `stats-data` branch (never master), and rebuilds the dashboard there.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      import-old:
        description: Path of an old-format snapshots/ layout on stats-data to import (`.` for the root); leave empty
        default: ""

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: elboletaire/github-stats-action@v0
        with:
          import-old: ${{ inputs.import-old }}
