name: Stats

# Keeps a daily snapshot of release downloads, Docker Hub pulls and stars on
# the `stats-data` branch (never master), and rebuilds the dashboard there.
on:
  schedule:
    # late in the day, so the partial current day is nearly whole; GitHub delays
    # scheduled runs by hours, and this still lands before midnight UTC
    - cron: "41 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: elboletaire/github-stats-action@v1
