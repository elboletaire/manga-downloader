name: Stats

# Keeps a daily snapshot of release downloads, Docker Hub pulls and stars on
# the `stats-data` branch (never master), and rebuilds the dashboard there.
on:
  schedule:
    # late in the day, so the partial current day is nearly whole; GitHub delays
    # scheduled runs by hours, and it slipped past midnight UTC on 2026-11-02,
    # so the earlier run is a backup that lands the day (the late one replaces it)
    - cron: "41 13 * * *"
    - cron: "41 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: elboletaire/github-stats-action@v1
        with:
          cloudflare-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
