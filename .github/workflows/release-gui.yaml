name: Release GUI

on:
  release:
    types: [published]

permissions:
  contents: write

# The GUI is a Wails app: a Go program embedding a React frontend that the
# platform's webview shows. Linux needs the WebKitGTK headers, so it's built on
# native runners. Windows needs no cgo, so both its architectures are built
# from one Linux runner, and macOS is built on a Mac for the universal binary.
# The tags and ldflags come from the makefile, which takes the jobs' $TAG as its
# TAG; `wails build` adds the desktop,production tags and -s -w itself.
# The wailsjs/ bindings are committed, so the build doesn't need a webview to
# generate them (-skipbindings). Windows arm64 is built too, so ARM Windows
# doesn't run the amd64 build emulated. Each Windows arch also gets an NSIS
# installer (gui/build/windows/installer/project.nsi) next to its zip. The last
# job publishes the SHA-256 of every GUI asset for the app's one-click update.
jobs:
  linux:
    name: Linux ${{ matrix.goarch }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
    - uses: actions/checkout@v4
    - name: Install WebKitGTK
      run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
    - uses: actions/setup-go@v5
      with:
        go-version-file: gui/go.mod
        cache-dependency-path: |
          go.sum
          gui/go.sum
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: gui/frontend/pnpm-lock.yaml
    - name: Install the Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
    - name: Build and package
      working-directory: gui
      run: |
        set -euo pipefail
        # the Windows version resource and the bundle's Info.plist take the version from wails.json
        sed "s/\"productVersion\": \"0.0.0\"/\"productVersion\": \"${TAG#v}\"/" wails.json > wails.json.new && mv wails.json.new wails.json
        tags="$(make -s -C .. --no-print-directory print-GUI_TAGS)"
        ldflags="$(make -s -C .. --no-print-directory print-GUI_LDFLAGS)"
        wails build -platform linux/${{ matrix.goarch }} -tags "$tags" -trimpath -skipbindings \
          -m -nosyncgomod -ldflags "$ldflags"
        name="manga-downloader-gui-$TAG-linux-${{ matrix.goarch }}"
        rm -rf "stage/$name" && mkdir -p "stage/$name"
        cp build/bin/manga-downloader-gui ../LICENSE "stage/$name/"
        cp build/linux/icon.png "stage/$name/manga-downloader-gui.png"
        cp ../packaging/linux/manga-downloader-gui.desktop ../packaging/linux/install.sh "stage/$name/"
        chmod 0755 "stage/$name/install.sh"
        # installs the staged files into a throwaway HOME, so a broken installer never ships
        sh ../packaging/linux/test-install.sh "stage/$name"
        tar -C stage -czf "$name.tar.gz" "$name"
        gh release upload "$TAG" "$name.tar.gz" --clobber

  windows:
    name: Windows ${{ matrix.goarch }}
    strategy:
      matrix:
        goarch: [amd64, arm64]
    # no cgo is needed to build the webview for Windows, so one Linux runner
    # does both architectures
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: gui/go.mod
        cache-dependency-path: |
          go.sum
          gui/go.sum
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: gui/frontend/pnpm-lock.yaml
    - name: Install NSIS
      run: sudo apt-get update && sudo apt-get install -y nsis
    - name: Install the Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
    - name: Build and package
      working-directory: gui
      run: |
        set -euo pipefail
        # the installer's VIProductVersion only takes X.Y.Z
        if ! [[ "${TAG#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::the tag $TAG isn't a numeric X.Y.Z version, which the Windows installer needs"
          exit 1
        fi
        # the Windows version resource, the installer's version and the bundle's Info.plist take the version from wails.json
        sed "s/\"productVersion\": \"0.0.0\"/\"productVersion\": \"${TAG#v}\"/" wails.json > wails.json.new && mv wails.json.new wails.json
        # wails embeds the icon and manifest from build/windows into the exe,
        # and links it as a GUI app (no console window)
        tags="$(make -s -C .. --no-print-directory print-GUI_TAGS)"
        ldflags="$(make -s -C .. --no-print-directory print-GUI_LDFLAGS)"
        wails build -platform windows/${{ matrix.goarch }} -tags "$tags" -trimpath -skipbindings \
          -m -nosyncgomod -nsis -ldflags "$ldflags"
        name="manga-downloader-gui-$TAG-windows-${{ matrix.goarch }}"
        rm -rf "stage/$name" && mkdir -p "stage/$name"
        cp build/bin/manga-downloader-gui.exe ../LICENSE "stage/$name/"
        (cd stage && zip -qr "../$name.zip" "$name")
        # the in-app updater looks the installer up by this name
        installer="$name-installer.exe"
        mv "build/bin/manga-downloader-gui-${{ matrix.goarch }}-installer.exe" "$installer"
        gh release upload "$TAG" "$name.zip" "$installer" --clobber

  macos:
    name: macOS universal
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: gui/go.mod
        cache-dependency-path: |
          go.sum
          gui/go.sum
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: gui/frontend/pnpm-lock.yaml
    - name: Install the Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
    - name: Build the app bundle
      working-directory: gui
      run: |
        set -euo pipefail
        # the Windows version resource and the bundle's Info.plist take the version from wails.json
        sed "s/\"productVersion\": \"0.0.0\"/\"productVersion\": \"${TAG#v}\"/" wails.json > wails.json.new && mv wails.json.new wails.json
        # a single universal target keeps the bundle's name as wails.json has
        # it ("Manga Downloader.app"), without an arch suffix
        tags="$(make -s -C .. --no-print-directory print-GUI_TAGS)"
        ldflags="$(make -s -C .. --no-print-directory print-GUI_LDFLAGS)"
        wails build -platform darwin/universal -tags "$tags" -trimpath -skipbindings \
          -m -nosyncgomod -ldflags "$ldflags"
        name="manga-downloader-gui-$TAG-darwin-universal"
        ditto -c -k --keepParent "build/bin/Manga Downloader.app" "$name.zip"
        gh release upload "$TAG" "$name.zip" --clobber

  checksums:
    name: Checksums
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
    # the app's one-click update verifies what it downloads against this file
    - name: Publish the checksums of the GUI assets
      run: |
        set -euo pipefail
        mkdir assets
        gh release download "$TAG" -p "manga-downloader-gui-$TAG-*" -D assets
        sums="manga-downloader-gui-$TAG-SHA256SUMS.txt"
        # a re-run finds the previous file among the assets
        rm -f "assets/$sums"
        for arch in amd64 arm64; do
          for want in "linux-$arch.tar.gz" "windows-$arch.zip" "windows-$arch-installer.exe"; do
            [ -f "assets/manga-downloader-gui-$TAG-$want" ] || { echo "::error::missing GUI asset manga-downloader-gui-$TAG-$want"; exit 1; }
          done
        done
        [ -f "assets/manga-downloader-gui-$TAG-darwin-universal.zip" ] || { echo "::error::missing GUI asset manga-downloader-gui-$TAG-darwin-universal.zip"; exit 1; }
        (cd assets && sha256sum -- * > "../$sums")
        cat "$sums"
        gh release upload "$TAG" "$sums" --clobber

  homebrew:
    name: Update the Homebrew cask
    needs: macos
    # prereleases don't go to the tap
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # release.yaml and release-gui.yaml both push to the tap, one formula and one
    # cask each: one at a time, so neither has to win a race
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
    - name: No tap token
      if: env.HAS_TAP_TOKEN != 'true'
      run: echo "::notice::HOMEBREW_TAP_TOKEN isn't set, so the Homebrew tap wasn't updated"
    - uses: actions/checkout@v4
      if: env.HAS_TAP_TOKEN == 'true'
      with:
        path: manga-downloader
        sparse-checkout: |
          packaging/homebrew
          scripts
        persist-credentials: false
    - uses: actions/checkout@v4
      if: env.HAS_TAP_TOKEN == 'true'
      with:
        repository: elboletaire/homebrew-tap
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        path: tap
        persist-credentials: false
    - name: Update the cask
      if: env.HAS_TAP_TOKEN == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.event.release.tag_name }}
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        set -euo pipefail
        version="${TAG#v}"
        assets="$RUNNER_TEMP/assets"
        mkdir -p "$assets"
        gh release download "$TAG" -p "manga-downloader-gui-$TAG-darwin-universal.zip" -D "$assets"
        mkdir -p tap/Casks
        # the old name stays a deprecated alias, so its installs get updates too
        for cask in manga-downloader-app manga-downloader; do
          cp "manga-downloader/packaging/homebrew/tap/Casks/$cask.rb" "tap/Casks/$cask.rb"
          manga-downloader/scripts/update-homebrew.sh "$version" "tap/Casks/$cask.rb" "$assets"
          ruby -c "tap/Casks/$cask.rb"
        done
        cd tap
        git add Casks/manga-downloader-app.rb Casks/manga-downloader.rb
        if git diff --cached --quiet; then echo "The tap already has the Manga Downloader app $version"; exit 0; fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit --quiet -m "manga-downloader (app) $version"
        auth="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
        echo "::add-mask::$auth"
        git_auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth")
        for attempt in 1 2 3; do
          if git "${git_auth[@]}" push --quiet origin HEAD:main; then exit 0; fi
          # a rejected last push is the end: rebasing again would never be pushed
          if [ "$attempt" = 3 ]; then break; fi
          # the tap moved since the checkout (the other release workflow, say): rebase onto it, then push again
          echo "::warning::the tap rejected the push, rebasing onto it (attempt $attempt)"
          git "${git_auth[@]}" fetch --quiet origin main
          git rebase --quiet FETCH_HEAD
        done
        echo "::error::couldn't push the cask to the tap"
        exit 1
