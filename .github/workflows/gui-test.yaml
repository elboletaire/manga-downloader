name: GUI test

# pushes to master, plus pull requests: a PR branch would otherwise run twice
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'website/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'website/**'

permissions:
  contents: read

# `make test/gui` builds the frontend first, as the GUI's Go module embeds its
# output. Linux needs the WebKitGTK headers, as in release-gui.yaml.
# The linux-install job checks packaging/linux/install.sh against a stub binary.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # a stalled Ubuntu mirror used to hang this for 30 minutes: cut each try at 3
    - name: Install WebKitGTK
      timeout-minutes: 10
      run: |
        for try in 1 2 3; do
          sudo timeout 180 sh -c 'apt-get update -o Acquire::Retries=3 && apt-get install -y -o Acquire::Retries=3 libgtk-3-dev libwebkit2gtk-4.1-dev' && exit 0
          echo "apt try $try failed or stalled, retrying"
          sudo dpkg --configure -a || true
        done
        exit 1
    - uses: actions/setup-go@v7
      with:
        go-version: "1.26"
        check-latest: true
        cache-dependency-path: |
          go.sum
          gui/go.sum
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: gui/frontend/package.json
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: gui/frontend/pnpm-lock.yaml
    - name: Test the GUI
      run: make test/gui

  linux-install:
    name: Linux install script
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install ShellCheck and desktop-file-utils
      run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils
    - name: Lint
      run: shellcheck packaging/linux/install.sh packaging/linux/test-install.sh
    - name: Install, upgrade and uninstall in a throwaway HOME
      run: sh packaging/linux/test-install.sh
