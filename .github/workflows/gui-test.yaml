name: GUI test

# pushes to master, plus pull requests: a PR branch would otherwise run twice
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'website/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'website/**'

permissions:
  contents: read

# The GUI's Go module embeds the frontend's build output, so the frontend is
# built first. Linux needs the WebKitGTK headers, as in release-gui.yaml.
# The linux-install job checks packaging/linux/install.sh against a stub binary.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install WebKitGTK
      run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
    - uses: actions/setup-go@v5
      with:
        go-version-file: gui/go.mod
        cache-dependency-path: |
          go.sum
          gui/go.sum
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: gui/frontend/pnpm-lock.yaml
    - name: Test the frontend
      working-directory: gui/frontend
      run: pnpm install --frozen-lockfile && pnpm build && pnpm test
    - name: Vet and test the Go app
      working-directory: gui
      run: |
        set -euo pipefail
        tags="$(make -s -C .. --no-print-directory print-GUI_GO_TAGS)"
        go vet -tags "$tags" ./...
        go test -race -tags "$tags" ./...

  linux-install:
    name: Linux install script
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install ShellCheck and desktop-file-utils
      run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils
    - name: Lint
      run: shellcheck packaging/linux/install.sh packaging/linux/test-install.sh
    - name: Install, upgrade and uninstall in a throwaway HOME
      run: sh packaging/linux/test-install.sh
