name: Testing

# pushes to master, plus pull requests: a PR branch would otherwise run twice
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Test
        run: make test

      # the demo build's fake grabber only builds with the demo tag
      - name: Test the demo tapes' fake grabber
        run: make test/demo
