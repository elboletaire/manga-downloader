name: Worker deploy

on:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - ".github/workflows/worker-deploy.yaml"
  # manual deploy, from master
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time; a running one finishes before the next starts
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: worker/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: make test/worker

      - run: make deploy/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
