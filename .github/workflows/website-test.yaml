name: Website testing

# pushes to master, plus pull requests: a PR branch would otherwise run twice
on:
  push:
    branches: [master]
    paths:
      - "website/**"
      # the supported sites list is generated from it
      - "README.md"
      - ".github/workflows/website-test.yaml"
  pull_request:
    paths:
      - "website/**"
      - "README.md"
      - ".github/workflows/website-test.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: make test/website

      - run: make build/website
