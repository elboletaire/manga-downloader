name: Release

on:
  release:
    types: [published]

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64, windows/386, windows/amd64, windows/arm64, darwin/amd64, darwin/arm64
        goos: [linux, windows, darwin]
        goarch: ["386", amd64, arm64]
        exclude:
          - goarch: "386"
            goos: darwin
        include:
          # windows/386 is renamed so people stop downloading it by mistake. The action
          # only uses asset_name when it's non-empty, so every other target keeps its
          # default name. It can't expand the tag itself, hence the release event's tag_name.
          - goos: windows
            goarch: "386"
            asset_name: manga-downloader-${{ github.event.release.tag_name }}-windows-32bit-legacy
    steps:
    - uses: actions/checkout@v4
    - name: Get short version and tag
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "tag=$(git describe --tags)" >> $GITHUB_ENV
    - uses: wangyoucao577/go-release-action@v1.55
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        goversion: "1.26"
        project_path: "."
        binary_name: "manga-downloader"
        # empty (the default name) for every target but windows/386, see the matrix
        asset_name: ${{ matrix.asset_name }}
        extra_files: LICENSE README.md
        # the makefile holds the build flags (tags, -trimpath, ldflags). The
        # action runs make with GOOS/GOARCH set, ignores build_flags/ldflags,
        # and packs ./manga-downloader(.exe), which build/release writes.
        build_command: make build/release VERSION=${{ env.sha_short }} TAG=${{ env.tag }}

  checksums:
    name: Checksums
    needs: releases-matrix
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
    - name: Publish the checksums of the CLI archives
      run: |
        set -euo pipefail
        # the names the matrix produces; the GUI assets share the prefix, so they're listed out, not globbed
        archives=(
          "manga-downloader-$TAG-linux-386.tar.gz"
          "manga-downloader-$TAG-linux-amd64.tar.gz"
          "manga-downloader-$TAG-linux-arm64.tar.gz"
          "manga-downloader-$TAG-darwin-amd64.tar.gz"
          "manga-downloader-$TAG-darwin-arm64.tar.gz"
          "manga-downloader-$TAG-windows-32bit-legacy.zip"
          "manga-downloader-$TAG-windows-amd64.zip"
          "manga-downloader-$TAG-windows-arm64.zip"
        )
        mkdir assets
        for a in "${archives[@]}"; do
          gh release download "$TAG" -p "$a" -D assets || { echo "::error::missing CLI archive $a"; exit 1; }
          [ -f "assets/$a" ] || { echo "::error::missing CLI archive $a"; exit 1; }
        done
        sums="manga-downloader-$TAG-SHA256SUMS.txt"
        # a re-run starts from the archives only, never from an earlier sums file
        rm -f "assets/$sums"
        (cd assets && sha256sum -- "${archives[@]}" > "../$sums")
        cat "$sums"
        gh release upload "$TAG" "$sums" --clobber

  homebrew:
    name: Update the Homebrew formula
    needs: releases-matrix
    # prereleases don't go to the tap
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # release.yaml and release-gui.yaml both push to the tap, one formula and one
    # cask each: one at a time, so neither has to win a race
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
    - name: No tap token
      if: env.HAS_TAP_TOKEN != 'true'
      run: echo "::notice::HOMEBREW_TAP_TOKEN isn't set, so the Homebrew tap wasn't updated"
    - uses: actions/checkout@v4
      if: env.HAS_TAP_TOKEN == 'true'
      with:
        path: manga-downloader
        sparse-checkout: |
          packaging/homebrew
          scripts
        persist-credentials: false
    - uses: actions/checkout@v4
      if: env.HAS_TAP_TOKEN == 'true'
      with:
        repository: elboletaire/homebrew-tap
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        path: tap
        persist-credentials: false
    - name: Update the formula
      if: env.HAS_TAP_TOKEN == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.event.release.tag_name }}
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        set -euo pipefail
        version="${TAG#v}"
        assets="$RUNNER_TEMP/assets"
        mkdir -p "$assets"
        # the four CLI archives: darwin and linux, amd64 and arm64
        gh release download "$TAG" -p "manga-downloader-$TAG-*.tar.gz" -D "$assets"
        mkdir -p tap/Formula
        cp manga-downloader/packaging/homebrew/tap/Formula/manga-downloader.rb tap/Formula/manga-downloader.rb
        manga-downloader/scripts/update-homebrew.sh "$version" tap/Formula/manga-downloader.rb "$assets"
        ruby -c tap/Formula/manga-downloader.rb
        cd tap
        git add Formula/manga-downloader.rb
        if git diff --cached --quiet; then echo "The tap already has manga-downloader $version"; exit 0; fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit --quiet -m "manga-downloader $version"
        auth="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
        echo "::add-mask::$auth"
        git_auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth")
        for attempt in 1 2 3; do
          if git "${git_auth[@]}" push --quiet origin HEAD:main; then exit 0; fi
          # a rejected last push is the end: rebasing again would never be pushed
          if [ "$attempt" = 3 ]; then break; fi
          # the tap moved since the checkout (the other release workflow, say): rebase onto it, then push again
          echo "::warning::the tap rejected the push, rebasing onto it (attempt $attempt)"
          git "${git_auth[@]}" fetch --quiet origin main
          git rebase --quiet FETCH_HEAD
        done
        echo "::error::couldn't push the formula to the tap"
        exit 1
