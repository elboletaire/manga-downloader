name: Docker

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
    # allowlist of what goes into the images: a new top-level package the CLI
    # imports must be added here (path filters don't apply to tag pushes)
    paths:
      - 'browser/**'
      - 'cmd/**'
      - 'core/**'
      - 'docker/**'
      - 'downloader/**'
      - 'grabber/**'
      - 'http/**'
      - 'notice/**'
      - 'packer/**'
      - 'ranges/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'makefile'
      - '.github/workflows/docker.yaml'
  pull_request:
    branches:
      - 'master'
    paths:
      - 'browser/**'
      - 'cmd/**'
      - 'core/**'
      - 'docker/**'
      - 'downloader/**'
      - 'grabber/**'
      - 'http/**'
      - 'notice/**'
      - 'packer/**'
      - 'ranges/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'makefile'
      - '.github/workflows/docker.yaml'
jobs:
  publish:
    name: Push docker image to docker hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get short version and tag
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "tag=$(git describe --tags)" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: elboletaire/manga-downloader
          # :latest follows releases only; master publishes :master
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Docker meta (browser)
        id: meta-browser
        uses: docker/metadata-action@v5
        with:
          images: elboletaire/manga-downloader
          # every tag gets a -browser suffix; releases also get the plain
          # :browser tag (the browser counterpart of :latest)
          flavor: |
            latest=false
            suffix=-browser
          tags: |
            type=raw,value=browser,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # PRs only check that the images build
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CI_COMMIT_REF_NAME=${{ env.tag }}

      - name: Build and push (browser)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.browser
          platforms: linux/amd64,linux/arm64
          # PRs only check that the images build
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-browser.outputs.tags }}
          labels: ${{ steps.meta-browser.outputs.labels }}
          build-args: |
            CI_COMMIT_REF_NAME=${{ env.tag }}
