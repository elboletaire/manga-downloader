# Config for the Stats workflow (elboletaire/github-stats-action).
groups:
  - { name: app, label: Desktop app, assets: "manga-downloader-gui-*" }
  - { name: cli, label: CLI, assets: "manga-downloader-*" }
ignore: ["*.md5", "*-SHA256SUMS.txt"]
counters:
  - { name: updates, label: In-app updates, assets: "manga-downloader-gui-*-SHA256SUMS.txt", from: v1.19.0, per-user: true }
epochs:
  - { version: v1.0.0, label: 1.0 rewrite }
  - { version: v1.11.0, label: First desktop app }
  - { version: v1.18.0, label: Installer and updater }
  - { version: v1.20.0, label: Multilingual }
  - { version: v23.0.0, label: Volume versions and Japanese }
platforms:
  - { match: "*-windows-amd64-installer.exe", label: Windows amd64 installer }
docker: elboletaire/manga-downloader
charts:
  stars: { from: 2024-01-01, title: false, height: 400, start-at-zero: true }
  stars@full: { title: false, height: 400 }     # the whole history, for github-stats-action's README
  downloads-per-day: { range: 30d }
  downloads-per-release: { from: 2026-10-10 }   # v1.11.0, the first desktop app
badges:
  downloads: { color: "#4cb70e" }               # the green the README badge always had
# Update checks the app and CLI send to the Worker (v23.0.0 on); AE keeps 3 months, the data branch keeps the rest.
cloudflare:
  dataset: manga_downloader_checks
  label: Update checks
  day: blob5
  primary: { client: gui }                      # the CLI only checks on --version, so it isn't usage
  note: The CLI only checks on --version, so CLI checks aren't usage; users are approximate daily counts.
  dimensions:
    client:  { column: blob1, label: App vs CLI, values: { gui: App, cli: CLI } }
    version: { column: blob2, label: Version, kind: semver, released: true }   # drops test builds of unreleased versions
    os:      { column: blob3, label: OS }
    arch:    { column: blob4, label: Arch }
    lang:    { column: blob6, label: App language }      # en, es, ca, ja or system; "" from the CLI and older apps
    syslang: { column: blob7, label: System language }   # the CLI always; the app only when it follows the system
