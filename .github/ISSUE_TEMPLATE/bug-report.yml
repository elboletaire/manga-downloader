name: Bug report
description: Report a problem with the desktop app or the command line tool
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: interface
    attributes:
      label: Where did it happen?
      options:
        - Desktop app
        - Command line
        - Docker image
        - All of them
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link
      description: The series or chapter link you used.
      placeholder: e.g. https://mangadex.org/title/...
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or options
      description: >-
        **Command line or Docker:** the exact command you ran, with all flags.
        **Desktop app:** the chapters you picked and any options you changed
        (language, scanlation group, image conversion, "Show the browser
        window"…), or "defaults".
      placeholder: e.g. manga-downloader --language es https://mangadex.org/title/... 1-10
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        **Desktop app:** the version shown in the bar at the bottom of the window.
        **Command line:** the output of `manga-downloader --version`. Please
        check first whether the problem still happens with the [latest
        release](https://github.com/elboletaire/manga-downloader/releases/latest):
        sites change constantly and fixes ship often.
      placeholder: e.g. v1.14.0
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What happened
      description: >-
        What did you expect, and what happened instead? Paste the program's
        output or error here: in the desktop app, open the log at the bottom
        and use its Copy button. Note a run can "succeed" but produce empty or
        broken CBZ files; if that's your case, say so.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other (specify below)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context (optional)
      description: >-
        Anything else worth knowing: whether it worked before, whether other
        series on the same site work, how you installed it (download,
        Homebrew, `go install`, Docker), or your browser setup if the site
        needs one (Chrome/Chromium/Brave/Edge).
    validations:
      required: false
